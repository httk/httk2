[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk2"
version = "2.1.3"
description = "The high-throughput toolkit (httk₂) is a modular Python toolkit for materials science. The httk2 metapackage installs the standard components of httk₂."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]
dependencies = [
  "httk-core[default]>=2.1.2,<3",
  "httk-atomistic[default]>=2.1.2,<3",
  "httk-store[default]>=2.1.4,<3",
  "httk-serve[default]>=2.1.3,<3",
  "httk-analyse[default]>=2.1.0,<3",
  "httk-workflow[default]>=2.1.1,<3",
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
default = []
abinit = ["httk-workflow-abinit>=0.1.0,<1"]
cp2k = ["httk-workflow-cp2k>=0.1.0,<1"]
gromacs = ["httk-workflow-gromacs>=0.1.0,<1"]
lammps = ["httk-workflow-lammps>=0.1.0,<1"]
orca = ["httk-workflow-orca>=0.1.0,<1"]
phonopy = ["httk-workflow-phonopy>=0.1.0,<1"]
qe = ["httk-workflow-qe>=0.1.0,<1"]
vasp = ["httk-workflow-vasp>=0.1.0,<1"]
codes = [
  "httk-workflow-abinit>=0.1.0,<1",
  "httk-workflow-cp2k>=0.1.0,<1",
  "httk-workflow-gromacs>=0.1.0,<1",
  "httk-workflow-lammps>=0.1.0,<1",
  "httk-workflow-orca>=0.1.0,<1",
  "httk-workflow-phonopy>=0.1.0,<1",
  "httk-workflow-qe>=0.1.0,<1",
  "httk-workflow-vasp>=0.1.0,<1",
]
release = [
  "build>=1.2",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org"
Repository = "https://github.com/httk/httk2"
Issues = "https://github.com/httk/httk2/issues"

[tool.setuptools]
packages = []
